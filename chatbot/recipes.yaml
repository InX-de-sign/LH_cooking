- name: "Tomato and Egg Stir-fry"
  aliases: ["tomato egg", "egg and tomato", "tomato and eggs", "eggs and tomatoes"]
  serves: 2
  time_minutes: 15
  difficulty: easy
  techniques: ["stir-fry", "beat eggs", "season to taste"]
  ingredients:
    - "4 eggs"
    - "3 medium ripe tomatoes, cut into wedges"
    - "2 spring onions, sliced, white and green parts kept apart"
    - "2 tablespoons neutral oil"
    - "1 teaspoon sugar"
    - "half a teaspoon salt"
  steps:
    - text: "Crack the eggs into a bowl with a pinch of the salt and beat them until no streaks of white remain."
      done_when: "The egg is an even yellow with a little froth on top."
    - text: "Heat 1 tablespoon of oil in a wok or frying pan over medium-high heat."
      done_when: "The oil shimmers and moves easily when you tilt the pan."
    - text: "Pour in the eggs, let them set for a few seconds, then push them gently into large soft curds. Take them out while they are still slightly wet."
      done_when: "Mostly set, soft and glossy, not dry or browned."
      timer_seconds: 45
    - text: "Add the remaining oil and the white parts of the spring onion, and stir for about 20 seconds."
      done_when: "The spring onion smells fragrant."
      timer_seconds: 20
    - text: "Add the tomato wedges and stir-fry until they soften and release their juice, about 2 to 3 minutes."
      done_when: "The tomatoes are soft at the edges and there is a little red sauce in the pan."
      timer_seconds: 150
    - text: "Stir in the sugar and the rest of the salt, then return the eggs and fold together until fully set, starting with about 30 seconds. Check that the egg mixture reaches 71 degrees Celsius with a food thermometer; continue cooking if needed."
      done_when: "The eggs are fully set with no liquid egg remaining and the egg mixture measures at least 71 degrees Celsius."
      timer_seconds: 30
    - text: "Taste, adjust the salt, scatter the green spring onion over the top and serve."
  facts:
    - facet: overview
      text: "Tomato and egg stir-fry is a quick home-style dish: soft scrambled egg folded into a sweet and sour tomato sauce."
      source: "starter:unverified"
    - facet: tip
      text: "Taking the eggs out while they are still a little wet keeps them soft, because they finish cooking when they go back into the hot tomatoes."
      source: "starter:unverified"
    - facet: substitution
      text: "If your tomatoes are not very ripe, add a tablespoon of ketchup or a splash of water with the tomatoes to help them make a sauce."
      source: "starter:unverified"
    - facet: substitution
      text: "Chives or a little chopped onion can stand in for spring onion."
      source: "starter:unverified"
    - facet: storage
      text: "Refrigerate tomato and egg in shallow covered containers within two hours, or one hour above 32 degrees Celsius; reheat to 74 degrees Celsius."
      source: "https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling"
    - facet: safety
      text: "Cook the egg mixture to at least 71 degrees Celsius, using a food thermometer; a timer or camera cannot confirm its internal temperature."
      source: "https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures"

- name: "Spaghetti Aglio e Olio"
  aliases: ["aglio e olio", "aglio olio", "garlic and oil pasta", "garlic spaghetti", "garlic pasta"]
  serves: 2
  time_minutes: 20
  difficulty: easy
  techniques: ["boil pasta", "al dente", "slice garlic", "emulsify", "season to taste"]
  ingredients:
    - "200 grams dried spaghetti"
    - "4 cloves garlic, thinly sliced"
    - "5 tablespoons olive oil"
    - "half a teaspoon chilli flakes"
    - "a small handful of parsley, chopped"
    - "salt for the pasta water"
  steps:
    - text: "Bring a large pot of water to a rolling boil and salt it generously."
      done_when: "Big bubbles break the surface constantly, even when you stir."
    - text: "Add the spaghetti, stir for the first minute so it does not stick, and cook it for one minute less than the packet says."
      done_when: "Bend a strand: it should be tender with a thin firm core."
    - text: "While the pasta cooks, put the olive oil and sliced garlic in a cold frying pan and warm them over low heat."
      done_when: "The garlic is sizzling gently and turning pale gold at the edges."
      timer_seconds: 240
    - text: "Add the chilli flakes, stir for a few seconds, then take the pan off the heat."
      timer_seconds: 10
    - text: "Before draining, scoop out a mug of the pasta water. Then drain the spaghetti."
    - text: "Put the pan back on medium heat, add the spaghetti and about half the reserved water, and toss hard for one to two minutes."
      done_when: "The oil and water have come together into a glossy sauce that clings to the pasta, with no pool of oil left in the pan."
      timer_seconds: 90
    - text: "Toss in the parsley, taste for salt, and serve straight away."
  facts:
    - facet: overview
      text: "Spaghetti aglio e olio is a Neapolitan pasta made from little more than garlic, olive oil and chilli, finished with starchy pasta water."
      source: "starter:unverified"
    - facet: tip
      text: "Starting the garlic in cold oil over low heat lets it flavour the oil slowly without burning."
      source: "starter:unverified"
    - facet: doneness
      text: "Pale gold garlic is perfect. Once garlic turns dark brown it tastes bitter, and it is better to start the garlic again."
      source: "starter:unverified"
    - facet: substitution
      text: "Spaghettini, linguine or any long pasta works in place of spaghetti."
      source: "starter:unverified"
    - facet: substitution
      text: "Without parsley the dish is still good; a squeeze of lemon or a little grated parmesan are common additions."
      source: "starter:unverified"

- name: "Pan-seared Chicken Breast"
  aliases: ["chicken breast", "pan fried chicken", "pan-fried chicken", "seared chicken", "pan seared chicken"]
  serves: 2
  time_minutes: 25
  difficulty: medium
  techniques: ["sear", "rest meat", "pound to even thickness", "season to taste"]
  ingredients:
    - "2 boneless skinless chicken breasts"
    - "1 tablespoon neutral oil"
    - "1 tablespoon butter"
    - "salt and black pepper"
  steps:
    - text: "Pat the chicken dry with kitchen paper. If one end is much thicker, pound it gently to an even thickness of about 2 centimetres."
      done_when: "The surface looks dry, not wet or shiny."
    - text: "Season both sides with salt and pepper, then wash your hands before touching anything else."
    - text: "Heat the oil in a heavy frying pan over medium-high heat."
      done_when: "The oil shimmers and flows easily; never add water to hot oil."
    - text: "Lay the chicken in the pan, presentation side down, and leave it alone for 5 to 6 minutes."
      done_when: "The underside is deep golden brown and releases from the pan without sticking."
      timer_seconds: 330
    - text: "Flip the chicken, reduce the heat to medium, add the butter, and cook for about 5 to 6 more minutes, spooning butter over the top. Check the thickest part of each breast with a food thermometer and keep cooking until both reach 74 degrees Celsius."
      done_when: "The thickest part of each breast measures at least 74 degrees Celsius on a food thermometer. Colour, clear juices and elapsed time cannot confirm safety."
      timer_seconds: 330
    - text: "Move the cooked chicken to a clean board, using clean utensils, and let it rest for 5 minutes before slicing."
      timer_seconds: 300
  facts:
    - facet: overview
      text: "Pan-seared chicken breast is browned in a hot pan on one side, flipped, and finished with butter for flavour."
      source: "starter:unverified"
    - facet: safety
      text: "Chicken is safe to eat when the thickest part reaches 74 degrees Celsius, which is 165 degrees Fahrenheit."
      source: "https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures"
    - facet: safety
      text: "Use a separate board and knife for raw chicken, and wash anything that touched it with hot soapy water."
      source: "https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling"
    - facet: tip
      text: "If the chicken sticks when you try to flip it, wait another minute; it releases on its own once a crust forms."
      source: "starter:unverified"
    - facet: substitution
      text: "Boneless chicken thighs work too; they take a little longer and stay juicier."
      source: "starter:unverified"
    - facet: storage
      text: "Refrigerate cooked chicken in shallow covered containers within two hours, or one hour above 32 degrees Celsius; reheat to 74 degrees Celsius."
      source: "https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling"

- name: "Tomato and Cucumber Salad"
  aliases: ["cucumber salad", "tomato cucumber salad", "tomato salad"]
  serves: 12
  time_minutes: 75
  difficulty: easy
  techniques: ["season to taste"]
  ingredients:
    - "4 large tomatoes, cubed"
    - "1 large cucumber, chopped"
    - "1 cup chopped red onion"
    - "1 cup chopped green pepper"
    - "one third cup chopped parsley"
    - "one third cup apple cider vinegar"
    - "1 tablespoon olive oil"
    - "2 cloves garlic, minced"
    - "half a teaspoon each of salt, black pepper and sugar"
  steps:
    - text: "Wash hands and rinse produce under running water before chopping. Combine tomatoes, cucumber, onion, pepper and parsley in a large bowl."
      done_when: "Vegetables are mixed."
    - text: "In a small bowl, stir vinegar, oil, garlic, salt, pepper and sugar into a dressing."
    - text: "Mix the dressing through the vegetables."
      done_when: "Vegetables are coated."
    - text: "Cover and refrigerate for at least one hour before serving."
      timer_seconds: 3600
  facts:
    - facet: overview
      text: "This large salad makes twelve side portions and needs an hour in the fridge."
      source: "https://www.nutrition.gov/recipes/tomato-and-cucumber-salad"
    - facet: timing
      text: "Allow at least one hour of refrigeration after mixing."
      source: "https://www.nutrition.gov/recipes/tomato-and-cucumber-salad"

- name: "Banana Oat Porridge"
  aliases: ["oatmeal", "porridge", "banana oats", "oat porridge"]
  serves: 1
  time_minutes: 10
  difficulty: easy
  techniques: ["simmer"]
  ingredients:
    - "half a cup rolled oats, not steel-cut oats"
    - "1 cup water"
    - "1 ripe banana"
  steps:
    - text: "Put the oats and water in a small saucepan and bring to a gentle simmer."
      done_when: "Small bubbles appear."
    - text: "Reduce the heat and stir often until the oats soften and thicken, about 5 minutes. Follow the oat packet if its cooking time differs."
      done_when: "Oats are tender and the porridge is creamy."
      timer_seconds: 300
    - text: "Turn off the heat. Peel and mash the banana, stir it into the porridge, and let it cool enough to eat."
  facts:
    - facet: overview
      text: "This house recipe is a single portion of rolled-oat porridge sweetened with banana; it has not been kitchen-tested."
      source: "house-notes:kitchen-untested"
    - facet: substitution
      text: "Steel-cut oats need different water and cooking times; follow their packet rather than this rolled-oat recipe."
      source: "house-notes:kitchen-untested"

- name: "Spicy Shrimp Glass Noodles"
  aliases: ["shrimp glass noodles", "prawn glass noodles", "spicy shrimp vermicelli", "spicy prawn vermicelli", "fried rice vermicelli with shrimp", "chinese fried spicy rice noodle and shrimp"]
  serves: 2
  time_minutes: 25
  difficulty: medium
  techniques: ["stir-fry", "season to taste"]
  ingredients:
    - "120 grams dry glass noodles, also called mung bean vermicelli"
    - "250 grams peeled, deveined raw shrimp"
    - "2 tablespoons neutral oil"
    - "2 shallots, thinly sliced"
    - "3 garlic cloves, sliced"
    - "3 spring onions, cut into short lengths"
    - "1 small red chilli, sliced, optional"
    - "2 tablespoons light soy sauce"
    - "1 tablespoon oyster sauce"
    - "1 teaspoon sugar"
    - "one third cup water"
  steps:
    - text: "Soak the glass noodles according to the packet until pliable, then drain. Mix soy sauce, oyster sauce, sugar and water in a cup."
      done_when: "The noodles bend without snapping and the sauce is mixed."
    - text: "Pat the shrimp dry. Heat 1 tablespoon oil in a wok over medium-high heat and cook the shrimp in one layer, turning once, until the flesh is pearly, opaque and firm. Remove to a clean plate."
      done_when: "The shrimp flesh is pearly or white and opaque throughout."
      timer_seconds: 240
    - text: "Add the remaining oil, shallots, garlic, spring onion whites and optional chilli. Stir-fry for about one minute without burning the garlic."
      done_when: "The shallots soften and the garlic smells fragrant."
      timer_seconds: 60
    - text: "Add noodles and sauce. Toss over medium heat for 2 to 4 minutes, separating the strands, until the noodles are tender and most sauce has been absorbed. Add a splash of water if the pan dries before they soften."
      done_when: "The noodles are tender, glossy and lightly browned by the sauce, with no puddle in the pan."
      timer_seconds: 180
    - text: "Return the cooked shrimp, add spring onion greens, toss until hot and serve immediately."
      done_when: "The shrimp is hot and evenly mixed through the noodles."
  facts:
    - facet: overview
      text: "This is a photo-inspired reconstruction of shrimp with thin, translucent noodles, shallots and spring onions; the exact original seasoning is unknown."
      source: "house-notes:photo-reconstruction"
    - facet: substitution
      text: "The noodles in the photo look like glass noodles, but thin rice vermicelli can be used instead; follow its packet soaking time."
      source: "house-notes:photo-reconstruction"
    - facet: tip
      text: "Start without chilli for a mild version, then add chilli oil or sliced chilli at the table to control the heat."
      source: "house-notes:kitchen-untested"
    - facet: safety
      text: "Cook shrimp until the flesh is pearly or white and opaque; keep raw seafood and its utensils apart from ready-to-eat food."
      source: "https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures"

- name: "Egg Fried Rice"
  aliases: ["fried rice with egg", "egg rice", "chinese egg fried rice"]
  serves: 2
  time_minutes: 15
  difficulty: easy
  techniques: ["stir-fry", "beat eggs"]
  ingredients:
    - "3 cups cooked rice, chilled promptly after cooking"
    - "2 eggs"
    - "2 spring onions, sliced"
    - "2 tablespoons neutral oil"
    - "1 tablespoon light soy sauce"
    - "quarter teaspoon salt, or to taste"
  steps:
    - text: "Break up the cold rice with a fork and beat the eggs in a bowl."
    - text: "Heat 1 tablespoon oil in a wok over medium-high heat. Scramble the eggs until fully set, then remove them to a plate."
      done_when: "No liquid egg remains."
    - text: "Add the remaining oil and rice; stir-fry for 3 to 4 minutes, breaking up clumps until steaming hot."
      done_when: "The rice grains are separate and hot throughout."
      timer_seconds: 210
    - text: "Stir in soy sauce, salt, eggs and spring onions. Toss for one minute and serve hot."
      done_when: "The sauce coats the rice evenly."
  facts:
    - facet: tip
      text: "Rice that has been chilled promptly is easier to separate in a hot pan than freshly cooked rice."
      source: "house-notes:kitchen-untested"
    - facet: safety
      text: "Refrigerate cooked rice promptly in shallow containers within two hours, or within one hour above 32 degrees Celsius."
      source: "https://www.foodsafety.gov/food-poisoning/bacteria-and-viruses"

- name: "Garlic Soy Noodles"
  aliases: ["soy garlic noodles", "garlic noodles", "soy sauce noodles"]
  serves: 2
  time_minutes: 15
  difficulty: easy
  techniques: ["boil pasta", "stir-fry", "season to taste"]
  ingredients:
    - "200 grams dried wheat noodles"
    - "4 garlic cloves, minced"
    - "2 tablespoons light soy sauce"
    - "1 teaspoon sugar"
    - "1 tablespoon neutral oil"
    - "2 spring onions, sliced"
  steps:
    - text: "Cook noodles according to the packet, drain and reserve a few tablespoons of cooking water."
      done_when: "The noodles are tender but still springy."
    - text: "Mix soy sauce and sugar. Warm oil in a pan over medium heat and stir the garlic for 30 seconds."
      done_when: "The garlic is fragrant but not brown."
      timer_seconds: 30
    - text: "Add noodles and sauce. Toss for one minute, loosening with a little reserved water if needed."
      done_when: "Each strand is coated and no dry clumps remain."
      timer_seconds: 60
    - text: "Scatter spring onions on top and serve."
  facts:
    - facet: substitution
      text: "Rice noodles can replace wheat noodles; use their packet cooking directions and check the sauce if avoiding gluten."
      source: "house-notes:kitchen-untested"

- name: "Ginger Scallion Steamed Fish"
  aliases: ["steamed fish", "ginger fish", "chinese steamed fish"]
  serves: 2
  time_minutes: 20
  difficulty: medium
  techniques: ["season to taste"]
  ingredients:
    - "2 boneless white fish fillets, about 150 grams each"
    - "20 grams ginger, cut into thin strips"
    - "3 spring onions, cut into thin strips"
    - "2 tablespoons light soy sauce"
    - "1 tablespoon neutral oil"
    - "2 tablespoons water"
  steps:
    - text: "Put the fillets on a heatproof plate that fits inside a steamer. Scatter half the ginger and spring onions over them."
    - text: "Steam over simmering water with the lid on for about 8 to 10 minutes, then check the thickest part with a food thermometer. Continue until it reaches 63 degrees Celsius."
      done_when: "The thickest part measures at least 63 degrees Celsius."
      timer_seconds: 540
    - text: "Carefully lift out the hot plate. Mix soy sauce and water and pour around the fish; add the remaining ginger and spring onions."
    - text: "Heat oil in a small pan until shimmering, then carefully spoon it over the aromatics and serve."
      done_when: "The aromatics sizzle and smell fragrant."
  facts:
    - facet: safety
      text: "Fish should reach 63 degrees Celsius at its thickest part; steam and elapsed time alone cannot confirm doneness."
      source: "https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures"

- name: "Garlic Bok Choy"
  aliases: ["bok choy stir fry", "pak choi", "garlic pak choi"]
  serves: 2
  time_minutes: 12
  difficulty: easy
  techniques: ["stir-fry", "season to taste"]
  ingredients:
    - "400 grams baby bok choy, halved and rinsed"
    - "3 garlic cloves, sliced"
    - "1 tablespoon neutral oil"
    - "2 tablespoons water"
    - "1 tablespoon light soy sauce"
  steps:
    - text: "Rinse between the bok choy leaves and drain well."
    - text: "Heat oil over medium-high heat and stir the garlic for 20 seconds."
      done_when: "The garlic smells fragrant but stays pale."
      timer_seconds: 20
    - text: "Add bok choy and toss for two minutes. Add water, cover and steam for two more minutes."
      done_when: "The stems are crisp-tender and the leaves have wilted."
      timer_seconds: 240
    - text: "Uncover, add soy sauce and toss briefly before serving."
  facts:
    - facet: tip
      text: "Drying the rinsed leaves reduces splattering when they meet the hot oil."
      source: "house-notes:kitchen-untested"

